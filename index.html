<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CPhnggg Vietsub Storage</title>
  <meta name="description" content="Kho lưu trữ các bản vietsub nhạc Touhou của CPhnggg.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎧%3C/text%3E%3C/svg%3E">
  <script>
    // Áp theme sớm để không bị nháy màu
    try { var t = JSON.parse(localStorage.getItem('vsub-theme')); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="app/styles.css">
</head>
<body>
  <a class="skip" href="#view">Bỏ qua tới nội dung</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="#/">
        <span class="brand-icon" aria-hidden="true">🎧</span>
        <span class="brand-text">
          <span class="brand-name">CPhnggg Vietsub Storage</span>
          <span class="brand-tag">Kho lưu trữ vietsub nhạc Touhou</span>
        </span>
      </a>
      <nav class="menu" aria-label="Menu chính">
        <a href="#/" data-nav="home">Trang chủ</a>
        <a href="#/new" data-nav="new" data-edit-only>+ Thêm bài</a>
        <a href="#/trash" data-nav="trash" data-edit-only>Thùng rác</a>
        <button type="button" id="btn-io" data-edit-only>Nhập/Xuất</button>
        <button type="button" id="btn-theme" class="icon-btn" aria-label="Đổi giao diện sáng/tối">☾</button>
      </nav>
    </div>
  </header>
  <div id="banner"></div>
  <main id="view" class="wrap" tabindex="-1">
    <div class="loading" aria-live="polite">Đang tải…</div>
  </main>
  <footer class="site-footer">
    <div class="wrap footer-inner">
      <span class="muted small">© CPhnggg · Vietsub nhạc Touhou Project (bản quyền bài hát thuộc về các circle).</span>
      <button type="button" id="btn-edit" class="btn small-btn">✎ Biên tập</button>
    </div>
  </footer>

  <script type="module" src="app/js/main.js"></script>
  <script>
    // Mở trực tiếp bằng file:// thì ES module bị chặn → hiện hướng dẫn
    setTimeout(function () {
      if (window.__vsubBooted) return;
      var v = document.getElementById('view');
      v.innerHTML = '<div class="empty"><h2>Không khởi động được trang</h2><p>' +
        (location.protocol === 'file:'
          ? 'Trang đang được mở trực tiếp từ file nên trình duyệt chặn script. Hãy mở qua <strong>GitHub Pages</strong>, hoặc chạy <code>python -m http.server 8000</code> trong thư mục rồi vào <code>http://localhost:8000</code>.'
          : 'Trình duyệt không chạy được script của trang. Hãy dùng phiên bản mới của Chrome, Edge hoặc Firefox.') +
        '</p></div>';
    }, 2500);
  </script>
</body>
</html>
